spring:
  # ── PostgreSQL (production) ────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: HikariPool-prod

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false

# ── Actuator (production) ─────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        # prometheus scraped internally; health/info safe to expose publicly
        include: health,info,prometheus
  endpoint:
    health:
      # never reveal DB/disk details to unauthenticated callers
      show-details: when-authorized
  info:
    env:
      # avoid leaking env-var values (may contain secrets) in /actuator/info
      enabled: false

# ── Logging (production) ──────────────────────────────────────────────────
logging:
  level:
    root: WARN
    org.example.orderservice: WARN
