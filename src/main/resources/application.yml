spring:
  application:
    name: order-service

  jackson:
    default-property-inclusion: non_null

  # ── PostgreSQL (dev) ───────────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orderdb}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:orderuser}
    password: ${DB_PASSWORD:orderpass}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      pool-name: HikariPool-dev

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8080

# ── Actuator & metrics ─────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  info:
    build:
      enabled: true
    java:
      enabled: true
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# ── Pagination ─────────────────────────────────────────────────────────────
  data:
    web:
      pageable:
        max-page-size: 100

# ── OpenAPI ────────────────────────────────────────────────────────────────
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# ── Rate limiting ──────────────────────────────────────────────────────────
rate-limit:
  auth:
    capacity: 10
    refill-tokens: 10
    refill-period-minutes: 1

# ── JWT ────────────────────────────────────────────────────────────────────
jwt:
  secret: order-service-jwt-signing-secret-key-for-hmac-sha256-algorithm

# ── Logging (dev) ──────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    org.example.orderservice: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
