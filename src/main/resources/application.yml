spring:
  application:
    name: order-service

  jackson:
    default-property-inclusion: non_null

  # ── H2 in-memory database (default / dev) ─────────────────────────────────
  datasource:
    url: jdbc:h2:mem:orderdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8080

# ── Actuator & metrics ─────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  info:
    build:
      enabled: true
    java:
      enabled: true
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# ── Pagination ─────────────────────────────────────────────────────────────
  data:
    web:
      pageable:
        max-page-size: 100

# ── OpenAPI ────────────────────────────────────────────────────────────────
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# ── JWT ────────────────────────────────────────────────────────────────────
jwt:
  secret: order-service-jwt-signing-secret-key-for-hmac-sha256-algorithm

# ── Logging (dev) ──────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    org.example.orderservice: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
